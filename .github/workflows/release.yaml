name: Release deployment artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish
        required: true
        type: string
        default: v3.0.0
permissions:
  contents: write
  packages: write
concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Locate chart sources
        run: |
          chart_dir=./charts/kang
          if [ ! -f "$chart_dir/Chart.yaml" ]; then
            chart_dir=./chart/kang
          fi
          echo "CHART_DIR=$chart_dir" >> "$GITHUB_ENV"
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.0
      - name: Validate release version and manifests
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(helm show chart "$CHART_DIR" | awk '/^version:/ {print $2}')"
          test "$RELEASE_TAG" = "v$version"
          helm repo add cloudnative-pg https://cloudnative-pg.github.io/charts
          helm dependency build "$CHART_DIR"
          helm lint "$CHART_DIR" --set backend.secret.existingName=validation-secret
          helm template kang "$CHART_DIR" --set backend.secret.existingName=validation-secret > /tmp/kang-rendered.yaml
          JWT_SECRET=validation-only POSTGRES_PASSWORD=validation-only docker compose -f compose/compose.yaml --env-file compose/.env.example config --no-env-resolution --quiet
      - name: Package artifacts
        run: |
          mkdir -p dist
          helm package "$CHART_DIR" --destination dist
          tar -czf dist/kang-compose.tar.gz compose
          cp kubernetes/kang.yaml dist/kang.yaml
          cp kubernetes/README.md dist/kubernetes-README.md
          cd dist
          sha256sum *.tgz *.tar.gz *.yaml *.md > SHA256SUMS
      - uses: oras-project/setup-oras@v2
        with:
          version: 1.3.0
      - name: Publish Helm OCI chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
          GH_OWNER: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" --pattern 'kang-*.tgz' --dir dist --clobber
          fi
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GH_USER" --password-stdin
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GH_USER" --password-stdin
          chart_version="${RELEASE_TAG#v}"
          chart_ref="ghcr.io/${GH_OWNER,,}/kang"
          legacy_ref="ghcr.io/${GH_OWNER,,}/kang-deploy/kang:${chart_version}"
          if oras resolve "$legacy_ref" >/dev/null 2>&1; then
            oras cp "$legacy_ref" "${chart_ref}:${chart_version}"
          else
            helm push "dist/kang-${chart_version}.tgz" "oci://ghcr.io/${GH_OWNER,,}"
          fi
          oras tag "${chart_ref}:${chart_version}" "$RELEASE_TAG"
          test "$(oras resolve "${chart_ref}:${chart_version}")" = "$(oras resolve "${chart_ref}:${RELEASE_TAG}")"
          helm show chart "oci://${chart_ref}" --version "$chart_version"
          helm show chart "oci://${chart_ref}:${RELEASE_TAG}"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; existing assets retained."
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
