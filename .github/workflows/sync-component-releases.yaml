name: Sync component releases
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-component-releases
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Sync chart with the latest component releases
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new_version=$(bash scripts/sync-component-versions.sh)
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
      - name: Commit and publish the chart release
        if: steps.sync.outputs.new_version != ''
        env:
          NEW_VERSION: ${{ steps.sync.outputs.new_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release chart $NEW_VERSION (component release sync)"
          git push origin HEAD:main
          git tag "v$NEW_VERSION"
          git push origin "v$NEW_VERSION"
