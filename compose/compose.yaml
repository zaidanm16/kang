name: kang

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kang
      POSTGRES_USER: kang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U kang -d kang"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/zaidanm16/kang-backend:v1.2.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: backend.env
    environment:
      DATABASE_DSN: "postgresql://kang:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/kang?sslmode=disable"
      SERVER_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/zaidanm16/kang-frontend:v3.2.1}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      API_URL: http://backend:8080
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      AUTH_COOKIE_NAME: kang_session
      AUTH_REFRESH_COOKIE_NAME: kang_refresh
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
